# HandymanRN Prometheus Configuration
# Scrapes metrics from application and infrastructure components

global:
  scrape_interval: 15s  # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'handymanrn-scalability-demo'

# AlertManager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alerting rules (optional)
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s

  # Django Application Metrics (if django-prometheus is added)
  - job_name: 'django-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']  # Access host from container
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Redis Metrics (if redis-exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:9121']
    scrape_interval: 10s

  # PostgreSQL Metrics (if postgres-exporter is added)
  - job_name: 'postgres'
    static_configs:
      - targets: ['host.docker.internal:9187']
    scrape_interval: 10s

  # Locust Load Test Metrics (custom)
  - job_name: 'locust'
    static_configs:
      - targets: ['host.docker.internal:8089']  # Locust web UI
    metrics_path: '/stats/requests'
    scrape_interval: 5s