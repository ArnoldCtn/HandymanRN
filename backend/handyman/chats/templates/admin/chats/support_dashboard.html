{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    .support-container {
        display: flex;
        height: calc(100vh - 150px);
        background: #f0f2f5;
        border: 1px solid #ddd;
        margin-top: 20px;
    }
    .chat-list {
        width: 300px;
        background: white;
        border-right: 1px solid #ddd;
        overflow-y: auto;
    }
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #e5ddd5;
    }
    .chat-header {
        padding: 15px;
        background: #ededed;
        border-bottom: 1px solid #ddd;
        font-weight: bold;
    }
    .messages-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }
    .message {
        max-width: 70%;
        margin-bottom: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
        position: relative;
    }
    .message.received {
        background: white;
        align-self: flex-start;
    }
    .message.sent {
        background: #dcf8c6;
        align-self: flex-end;
    }
    .message-time {
        font-size: 10px;
        color: #888;
        margin-top: 4px;
        text-align: right;
    }
    .chat-input {
        padding: 15px;
        background: #f0f0f0;
        display: flex;
    }
    .chat-input input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 20px;
        margin-right: 10px;
    }
    .chat-input button {
        padding: 10px 20px;
        background: #075e54;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }
    .conv-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
    }
    .conv-item:hover {
        background: #f5f5f5;
    }
    .conv-item.active {
        background: #ebebeb;
    }
    .conv-name {
        font-weight: bold;
        display: block;
    }
    .conv-last {
        font-size: 12px;
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>
{% endblock %}

{% block content %}
<div class="support-container">
    <div class="chat-list" id="chatList">
        {% for conv in conversations %}
        <div class="conv-item" data-id="{{ conv.id }}" data-room="{% if conv.user %}support_{{ conv.user.id }}{% else %}support_h_{{ conv.handyman.id }}{% endif %}" data-name="{{ conv }}">
            <span class="conv-name">{{ conv }}</span>
            <span class="conv-last">{{ conv.messages.last.message|default:"No messages" }}</span>
        </div>
        {% endfor %}
    </div>
    <div class="chat-main">
        <div class="chat-header" id="chatHeader">Select a conversation</div>
        <div class="messages-container" id="messagesContainer">
            <!-- Messages will appear here -->
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>
</div>

<script>
    let socket = null;
    let currentRoom = null;
    let currentConvId = null;

    const chatList = document.getElementById('chatList');
    const messagesContainer = document.getElementById('messagesContainer');
    const chatHeader = document.getElementById('chatHeader');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // Global notification socket for staff
    const globalProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const globalSocket = new WebSocket(`${globalProtocol}//${window.location.host}/ws/support/support_global/`);
    
    globalSocket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'global_notification') {
            const msg = data.message;
            const roomName = data.room_name;
            
            // 1. Show a notification (simple alert or toast)
            showGlobalToast(`New message from ${msg.sender_username}: ${msg.message}`);
            
            // 2. Update the chat list entry if it exists
            const convItem = document.querySelector(`.conv-item[data-room="${roomName}"]`);
            if (convItem) {
                const lastMsgSpan = convItem.querySelector('.conv-last');
                if (lastMsgSpan) lastMsgSpan.innerText = msg.message;
                // Move to top
                chatList.prepend(convItem);
            } else {
                // Optionally refresh page or dynamically add new item
                console.log("New conversation started, refresh recommended");
            }

            // 3. If this is the currently open chat, append it
            if (currentRoom === roomName) {
                appendMessage(msg);
                scrollToBottom();
            }
        }
    };

    function showGlobalToast(text) {
        // Simple implementation of a toast
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.top = '20px';
        toast.style.right = '20px';
        toast.style.background = '#075e54';
        toast.style.color = 'white';
        toast.style.padding = '15px';
        toast.style.borderRadius = '5px';
        toast.style.zIndex = '10000';
        toast.style.boxShadow = '0 2px 10px rgba(0,0,0,0.2)';
        toast.innerText = text;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    }

    chatList.addEventListener('click', (e) => {
        const item = e.target.closest('.conv-item');
        if (!item) return;

        // UI active state
        document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');

        const roomId = item.getAttribute('data-room');
        const convName = item.getAttribute('data-name');
        const convId = item.getAttribute('data-id');

        openChat(roomId, convName, convId);
    });

    function openChat(roomId, name, convId) {
        if (socket) {
            socket.close();
        }

        currentRoom = roomId;
        currentConvId = convId;
        chatHeader.innerText = name;
        messagesContainer.innerHTML = 'Loading messages...';
        messageInput.disabled = false;
        sendBtn.disabled = false;

        // Fetch history via REST API
        fetch(`/chats/support/history/${convId}/`)
            .then(res => res.json())
            .then(data => {
                messagesContainer.innerHTML = '';
                data.forEach(msg => {
                    appendMessage(msg);
                });
                scrollToBottom();
            });

        // Setup WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${window.location.host}/ws/support/${roomId}/`);

        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);
            appendMessage(data.message);
            scrollToBottom();
        };

        socket.onclose = () => {
            console.log('Socket closed');
        };
    }

    function appendMessage(msg) {
        const div = document.createElement('div');
        div.className = `message ${msg.is_from_admin ? 'sent' : 'received'}`;
        div.innerHTML = `
            <div>${msg.message}</div>
            <div class="message-time">${msg.created_at}</div>
        `;
        messagesContainer.appendChild(div);
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !socket) return;

        socket.send(JSON.stringify({
            'message': text
        }));
        messageInput.value = '';
    }
</script>
{% endblock %}
